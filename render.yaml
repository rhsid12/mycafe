# Render Blueprint — https://render.com/docs/blueprint-spec
# Dashboard → New → Blueprint → connect this repo

databases:
  - name: mycafe-db
    plan: free
    databaseName: mycafe
    user: mycafe

services:
  - type: web
    name: mycafe
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build && npm ci --prefix server
    preDeployCommand: npm run server:init-db
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mycafe-db
          property: connectionString
